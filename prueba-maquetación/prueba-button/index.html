<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="./index.js"></script>
</head>

<body>
  <div class="modal-button">
    <button type="button">Log in</button>
  </div>

  <form class="login-form login-form-hidden">
    <label for="username">Usuario</label>
    <input type="text" id="username" name="username">

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password">

    <button class="login-button" type="submit">Ingresar</button>
    <button class="cancel-button" type="button">Cancelar</button>
  </form>

  <div class="notification-success notification-hidden">
    <p>Login realizado correctamente</p>
    <button class="close-notification-button" type="button">Cerrar</button>
  </div>

  <div class="notification-error notification-hidden">
    <p>Login incorrecto</p>
    <button class="close-notification-button" type="button">Cerrar</button>
  </div>
</body>

</html>
